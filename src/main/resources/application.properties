server.port=${PORT:${SERVER_PORT:9000}}
server.address=0.0.0.0
spring.main.allow-bean-definition-overriding=true

# -------------------------------------------------------
# DATABASE CONFIGURATION
# Default configured for MySQL (AWS RDS / Local). Supports dynamic SPRING_DATASOURCE_* overrides.
# -------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kfpcl_exports_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# -------------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# -------------------------------------------------------
# FILE UPLOAD PROPERTIES
# -------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------
# AWS S3 CONFIGURATION
# -------------------------------------------------------
aws.region=${AWS_REGION:ap-south-2}
aws.s3.bucket=${AWS_S3_BUCKET:kfpcl-exports-media-319759856065}

# -------------------------------------------------------
# ACTUATOR / HEALTH CHECK CONFIGURATION
# -------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# -------------------------------------------------------
# SERVER & RESPONSE SETTINGS
# -------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
spring.mvc.contentnegotiation.favor-parameter=true
spring.mvc.contentnegotiation.ignore-accept-header=true
spring.mvc.contentnegotiation.default-content-type=application/json

server.compression.enabled=true
server.compression.mime-types=application/json,application/*+json
server.compression.min-response-size=1024

# -------------------------------------------------------
# H2 CONSOLE
# -------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
