server.port=${PORT:${SERVER_PORT:9000}}
server.address=0.0.0.0
spring.main.allow-bean-definition-overriding=true

# -------------------------------------------------------
# DATABASE CONFIGURATION (Supabase PostgreSQL)
# -------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.qmsrpeqqmrhbctinhqkw}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:NJ9PWW7eAQDLpIjB}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# -------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# -------------------------------------------------------
# FILE UPLOAD PROPERTIES
# -------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# -------------------------------------------------------
# STORAGE CONFIGURATION (Supabase S3 Compatible)
# -------------------------------------------------------
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket=${AWS_S3_BUCKET:kfpcl-exports-media}
aws.s3.endpoint=${AWS_S3_ENDPOINT:https://qmsrpeqqmrhbctinhqkw.storage.supabase.co/storage/v1/s3}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:e4b0416be3d44a7b560206966364511e}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:49b69315bd6cf10a6ac131dd025836eb9a5215636adf76cedefcdcd33755e1d6}


# -------------------------------------------------------
# ACTUATOR / HEALTH CHECK CONFIGURATION
# -------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# -------------------------------------------------------
# SERVER & RESPONSE SETTINGS
# -------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
spring.mvc.contentnegotiation.favor-parameter=true
spring.mvc.contentnegotiation.ignore-accept-header=true
spring.mvc.contentnegotiation.default-content-type=application/json

server.compression.enabled=true
server.compression.mime-types=application/json,application/*+json
server.compression.min-response-size=1024

# -------------------------------------------------------
# H2 CONSOLE
# -------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
