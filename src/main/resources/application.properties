server.port=${PORT:${SERVER_PORT:9000}}

# -------------------------------------------------------
# POSTGRESQL DATABASE CONFIGURATION
# Configured with PostgreSQL user 'postgres' and password '123'
# -------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kfpcl_exports_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:123}}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# File upload properties
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------
# AWS S3 CONFIGURATION
# -------------------------------------------------------
aws.region=${AWS_REGION:ap-south-2}
aws.s3.bucket=${AWS_S3_BUCKET:kfpcl-exports-media-319759856065}

# -------------------------------------------------------
# ACTUATOR / HEALTH CHECK CONFIGURATION
# -------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
