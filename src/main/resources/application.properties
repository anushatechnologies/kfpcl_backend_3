spring.application.name=Kfpcl
server.port=9000

# ── Database Configuration (H2 Default for Local Run / PostgreSQL via env vars) ──
spring.datasource.url=${DB_URL:jdbc:h2:mem:kfpcl_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ── JPA / Hibernate Settings ──────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ── Jackson JSON Serialization Settings ────────────────────────────────────────
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ── Server & Response Settings ────────────────────────────────────────────────
server.address=0.0.0.0
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.mvc.contentnegotiation.favor-parameter=true
spring.mvc.contentnegotiation.ignore-accept-header=true
spring.mvc.contentnegotiation.default-content-type=application/json

server.compression.enabled=true
server.compression.mime-types=application/json,application/*+json
server.compression.min-response-size=1024

# ── H2 Console ────────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT Configuration ─────────────────────────────────────────────────────────
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
