server.port=${PORT:${SERVER_PORT:9000}}

# -------------------------------------------------------
# DATABASE CONFIGURATION
# Configured via environment variables with local defaults
# Supports both standard SPRING_DATASOURCE_* variables and
# container-level DB_HOST, DB_USER, DB_NAME variables.
# -------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kfpcl_exports_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# ddl-auto=update automatically creates/updates database schema
# on application startup prior to DataInitializer execution.
# -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# File upload properties
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------
# ACTUATOR / HEALTH CHECK CONFIGURATION
# Exposes /actuator/health for ECS target group health check
# -------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
