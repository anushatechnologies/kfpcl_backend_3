spring.application.name=Kfpcl
server.port=8080

# DataSource Configuration
spring.datasource.url=jdbc:h2:mem:kfpcl_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Jackson JSON Serialization Settings
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.time-zone=Asia/Kolkata

# Server & Response Settings
server.address=0.0.0.0
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
server.compression.enabled=true
server.compression.mime-types=application/json,application/*+json
server.compression.min-response-size=1024
