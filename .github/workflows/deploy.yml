name: KFPCL Backend CI/CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-2
  ECR_REGISTRY: 319759856065.dkr.ecr.ap-south-2.amazonaws.com
  ECR_REPOSITORY: kfpcl-backend
  ECS_CLUSTER: kfpcl-cluster
  ECS_SERVICE: kfpcl-backend-service

permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================
  # 1. BUILD
  # ==========================================
  build:
    name: 1. Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create Firebase Service Account JSON
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" > src/main/resources/serviceAccountKey.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application
        run: mvn -B clean package -DskipTests

  # ==========================================
  # 2. PUSH TO ECR
  # ==========================================
  push-to-ecr:
    name: 2. Push to ECR
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create Firebase Service Account JSON
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" > src/main/resources/serviceAccountKey.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            .

          docker tag \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Push image to ECR
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

  # ==========================================
  # 3. DEPLOY TO ECS
  # ==========================================
  deploy:
    name: 3. Deploy to ECS
    needs: push-to-ecr
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # ==========================================
      # VERIFY AWS ACCOUNT / REGION / ECS SERVICE
      # ==========================================
      - name: Verify AWS ECS
        run: |
          echo "=========================================="
          echo "AWS REGION: $AWS_REGION"
          echo "ECS CLUSTER: $ECS_CLUSTER"
          echo "ECS SERVICE: $ECS_SERVICE"
          echo "=========================================="

          echo "===== AWS ACCOUNT ====="
          aws sts get-caller-identity

          echo "===== ECS SERVICE ====="
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      # ==========================================
      # DEPLOY
      # ==========================================
      - name: Deploy latest image to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

      # ==========================================
      # WAIT FOR DEPLOYMENT
      # ==========================================
      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Deployment completed
        run: echo "KFPCL backend deployed successfully!"
