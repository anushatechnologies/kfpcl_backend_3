name: KFPCL Backend CI/CD (Direct SSH to EC2)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create Firebase Service Account JSON
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p src/main/resources
          if [ -n "$FIREBASE_SECRET" ]; then
            printf "%s" "$FIREBASE_SECRET" > src/main/resources/serviceAccountKey.json
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Find JAR file
        run: |
          JAR_FILE=$(ls target/*.jar | head -n 1)
          echo "Found JAR: $JAR_FILE"
          cp "$JAR_FILE" target/app.jar

      - name: Deploy to EC2 via Native SSH & SCP
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh

          # Reconstruct perfect PEM RSA format (resolves libcrypto error)
          python3 -c "
          import os
          key = os.environ.get('SSH_KEY', '').strip()
          content = key.replace('-----BEGIN RSA PRIVATE KEY-----', '').replace('-----END RSA PRIVATE KEY-----', '')
          content = content.replace('-----BEGIN OPENSSH PRIVATE KEY-----', '').replace('-----END OPENSSH PRIVATE KEY-----', '')
          content = content.replace('-----BEGIN PRIVATE KEY-----', '').replace('-----END PRIVATE KEY-----', '')
          b64 = ''.join(content.split())
          chunks = [b64[i:i+64] for i in range(0, len(b64), 64)]
          formatted_key = '-----BEGIN RSA PRIVATE KEY-----\n' + '\n'.join(chunks) + '\n-----END RSA PRIVATE KEY-----\n'
          with open(os.path.expanduser('~/.ssh/id_rsa'), 'w') as f:
              f.write(formatted_key)
          "
          chmod 600 ~/.ssh/id_rsa

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o HostkeyAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa"

          # Copy JAR to EC2
          echo "Copying app.jar to EC2..."
          scp -i ~/.ssh/id_rsa $SSH_OPTS target/app.jar "$EC2_USER@$EC2_HOST":/home/ubuntu/app/app.jar

          # Restart service on EC2
          echo "Restarting kfpcl-backend service..."
          ssh -i ~/.ssh/id_rsa $SSH_OPTS "$EC2_USER@$EC2_HOST" "sudo systemctl restart kfpcl-backend"

          echo "Deployment completed successfully!"

