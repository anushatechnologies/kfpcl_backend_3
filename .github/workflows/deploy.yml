name: KFPCL Backend CI/CD (Direct SSH to EC2)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create Firebase Service Account JSON
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p src/main/resources
          if [ -n "$FIREBASE_SECRET" ]; then
            printf "%s" "$FIREBASE_SECRET" > src/main/resources/serviceAccountKey.json
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Find JAR file
        run: |
          JAR_FILE=$(ls target/*.jar | head -n 1)
          echo "Found JAR: $JAR_FILE"
          cp "$JAR_FILE" target/app.jar

      - name: Deploy to EC2 via Native SSH & SCP
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          # Write and normalize SSH key
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Add EC2 host to known hosts
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # Copy JAR to EC2
          echo "Copying app.jar to EC2..."
          scp -i ~/.ssh/id_rsa target/app.jar "$EC2_USER@$EC2_HOST":/home/ubuntu/app/app.jar

          # Restart service on EC2
          echo "Restarting kfpcl-backend service..."
          ssh -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" "sudo systemctl restart kfpcl-backend && sudo systemctl status kfpcl-backend --no-pager"

